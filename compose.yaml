name: family-spending-web

services:
  web:
    container_name: family-spending-web
    build:
      context: .
    image: family-spending-web:local
    restart: unless-stopped
    init: true
    read_only: true
    ports:
      - "${FAMILY_SPENDING_WEB_BIND_ADDRESS:-127.0.0.1}:${FAMILY_SPENDING_WEB_PORT:-8080}:8080"
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

